name: Update python constraints
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"
jobs:
  constraints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Work around permission issue
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build constraints.txt
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:26.04 \
          sh scripts/update-constraints.sh --in-docker

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        if: ${{ success() }}
        with:
          branch: update-constraints
          delete-branch: true
          commit-message: Update constraints.txt
          title: 'Update constraints.txt'
          body: |
            This pull request updates constraints.txt. Make sure you run make tests manually.
          assignees: matentzn
