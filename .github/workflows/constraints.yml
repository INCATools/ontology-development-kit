name: Update python constraints
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"
jobs:
  constraints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Work around permission issue
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build constraints.txt
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:26.04 \
          sh scripts/update-constraints.sh --in-docker

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ success() }}
        with:
          branch: update-constraints
          delete-branch: true
          commit-message: Update constraints.txt
          title: 'Update constraints.txt'
          body: |
            This pull request updates constraints.txt. Make sure you run make tests manually.
          assignees: matentzn
